; =====================================================================
; DefaultEngine.ini — AcUnreal project engine defaults.
;
; This file is THE source of "modern client" presentation settings:
; Lumen GI + reflections, hardware ray tracing, Nanite, DX12 RHI. UE5
; reads it once on project load and bakes the choices into the
; renderer / RHI before any of our gameplay code runs.
;
; **Brief invariant:** presentation may diverge from the original
; freely (Lumen, RT, Niagara). Simulation is unaffected by anything
; here — the sim core lives in C++ with its own data-driven params
; (Content/Data/* DataAssets sourced from ac_sim::FMovementParams).
;
; Hardware target documented in README: NVIDIA RTX 4090 (24 GB) which
; comfortably supports Lumen HW RT path. If you run on weaker
; hardware, drop r.Lumen.HardwareRayTracing to 0 and Lumen falls back
; to its software-ray-traced path (still GI + reflections, just slower
; quality for distant geometry).
; =====================================================================

[/Script/HardwareTargeting.HardwareTargetingSettings]
TargetedHardwareClass=Desktop
AppliedTargetedHardwareClass=Desktop
DefaultGraphicsPerformance=Maximum
AppliedDefaultGraphicsPerformance=Maximum

[/Script/WindowsTargetPlatform.WindowsTargetSettings]
; DX12 is required for hardware ray tracing. SM6 enables Nanite
; + Lumen HWRT pipelines. We keep SM5 also targeted so the project
; still builds and runs on hardware/drivers that don't fully support
; SM6 (Lumen falls back to its software-RT path on SM5; HW RT is
; gracefully disabled). Without SM5 in the target list, an SM5-only
; machine would see a black screen on first cook.
DefaultGraphicsRHI=DefaultGraphicsRHI_DX12
+D3D12TargetedShaderFormats=PCD3D_SM6
+D3D12TargetedShaderFormats=PCD3D_SM5
+VulkanTargetedShaderFormats=SF_VULKAN_SM6

[/Script/Engine.RendererSettings]
; --- Lumen GI + reflections (UE5 modern lighting path) -----------
r.DynamicGlobalIlluminationMethod=1
r.ReflectionMethod=1
r.GenerateMeshDistanceFields=True
r.Mobile.EnableMovableSpotlightsShadow=True

; --- Hardware ray tracing ----------------------------------------
r.RayTracing=True
r.RayTracing.Shadows=1
r.RayTracing.SkyLight=1
r.RayTracing.AmbientOcclusion=1
r.RayTracing.Reflections=1
r.RayTracing.Translucency=1
r.RayTracing.Geometry.StaticMeshes=True
r.RayTracing.Geometry.SkeletalMeshes=True
r.RayTracing.Geometry.NiagaraMeshes=True
r.RayTracing.Geometry.NiagaraRibbons=True
r.RayTracing.Geometry.Landscape=True
r.RayTracing.Geometry.HairStrands=True

; --- Lumen hardware-RT path (RTX 4090 capable) -------------------
r.Lumen.HardwareRayTracing=1
r.Lumen.HardwareRayTracing.LightingMode=2
r.Lumen.HardwareRayTracing.Inline=1
r.Lumen.Reflections.HardwareRayTracing=1
r.Lumen.TranslucencyVolume.HardwareRayTracing=1
r.Lumen.ScreenProbeGather.HardwareRayTracing=1

; --- Nanite ------------------------------------------------------
; Enable globally. The brief is honest: this won't meaningfully help
; the 1999-era low-poly source meshes; the value lands when we
; re-author or import high-poly replacements. Decision logged in
; README #14.
r.Nanite=1
r.Nanite.ProjectEnabled=True
r.SkinCache.CompileShaders=True

; --- Anti-aliasing / upscaling -----------------------------------
r.AntiAliasingMethod=4   ; TSR (Temporal Super Resolution)
r.TemporalAA.Algorithm=1
r.AllowStaticLighting=False  ; fully dynamic; Lumen handles it

; --- Defaults the brief calls out as visual upgrades -------------
r.DefaultFeature.AutoExposure=True
r.DefaultFeature.AutoExposure.ExtendDefaultLuminanceRange=True
r.DefaultFeature.MotionBlur=False
r.DefaultFeature.Bloom=True
r.DefaultFeature.LensFlare=True
r.DefaultFeature.AmbientOcclusion=True
r.DefaultFeature.AmbientOcclusionStaticFraction=False

; --- Virtual textures + virtual shadow maps ----------------------
r.VirtualTextures=True
r.VirtualTexturedLightmaps=True
r.Shadow.Virtual.Enable=1

; --- Shading model -----------------------------------------------
r.CustomDepth=3   ; enable with stencil

[/Script/Engine.UserInterfaceSettings]
RenderFocusRule=NavigationOnly

[/Script/Engine.Engine]
+ActiveGameNameRedirects=(OldGameName="TP_Blank",NewGameName="/Script/AcUnreal")
+ActiveGameNameRedirects=(OldGameName="/Script/TP_Blank",NewGameName="/Script/AcUnreal")

