; =====================================================================
; DefaultEngine.ini — AcUnreal project engine defaults.
;
; This file is THE source of "modern client" presentation settings:
; Lumen GI + reflections, hardware ray tracing, Nanite, DX12 RHI. UE5
; reads it once on project load and bakes the choices into the
; renderer / RHI before any of our gameplay code runs.
;
; **Brief invariant:** presentation may diverge from the original
; freely (Lumen, RT, Niagara). Simulation is unaffected by anything
; here — the sim core lives in C++ with its own data-driven params
; (Content/Data/* DataAssets sourced from ac_sim::FMovementParams).
;
; Hardware target documented in README: NVIDIA RTX 4090 (24 GB) which
; comfortably supports Lumen HW RT path. If you run on weaker
; hardware, drop r.Lumen.HardwareRayTracing to 0 and Lumen falls back
; to its software-ray-traced path (still GI + reflections, just slower
; quality for distant geometry).
; =====================================================================

[/Script/HardwareTargeting.HardwareTargetingSettings]
TargetedHardwareClass=Desktop
AppliedTargetedHardwareClass=Desktop
DefaultGraphicsPerformance=Maximum
AppliedDefaultGraphicsPerformance=Maximum

[/Script/WindowsTargetPlatform.WindowsTargetSettings]
; DX12 is required for hardware ray tracing. SM6 enables Nanite
; + Lumen HWRT pipelines. We keep SM5 also targeted so the project
; still builds and runs on hardware/drivers that don't fully support
; SM6 (Lumen falls back to its software-RT path on SM5; HW RT is
; gracefully disabled). Without SM5 in the target list, an SM5-only
; machine would see a black screen on first cook.
DefaultGraphicsRHI=DefaultGraphicsRHI_DX12
+D3D12TargetedShaderFormats=PCD3D_SM6
+D3D12TargetedShaderFormats=PCD3D_SM5
+VulkanTargetedShaderFormats=SF_VULKAN_SM6

[/Script/Engine.RendererSettings]
; --- Lumen GI + reflections (DISABLED 2026-05-30 — fallback RTPSO leaves
; --- meshes rendering nearly pure black in -game mode because Lumen's
; --- software-RT shaders haven't compiled by the time HighResShot fires).
; --- Was: r.DynamicGlobalIlluminationMethod=1, r.ReflectionMethod=1
r.DynamicGlobalIlluminationMethod=0
r.ReflectionMethod=0
r.GenerateMeshDistanceFields=False
r.Mobile.EnableMovableSpotlightsShadow=True

; --- Hardware ray tracing (DISABLED 2026-05-30 — same fallback RTPSO issue)
; --- Was: r.RayTracing=True + a dozen feature toggles
r.RayTracing=False

; --- Lumen hardware-RT path (DISABLED 2026-05-29 due to renderer crash) ----
; Symptom: AcademyMap crashes on load with
;   Assertion failed: IntFitsIn<OutType>(In) in UnrealEditor-Renderer.dll
;   File: Engine/Source/Runtime/Core/Public/Templates/UnrealTemplate.h:170
; Disabling shadows on 132 PointLights didn't help — same crash address.
; The academy has ~1500 actors which seems to overflow some HW-RT-side
; container (BLAS/TLAS instance count, mesh card cluster index, etc).
; Disabling HW RT — Lumen falls back to its software-ray-traced path,
; which still gives GI + reflections, just lower quality at distance.
; If this fixes the crash, the proper long-term answer is one of:
;   (a) merge cells/setups into HISMs to cut instance count
;   (b) wait for the per-mesh "Has Distance Field" gate to land
;   (c) drop World Partition / streaming barriers between floors
; Originally:
;   r.Lumen.HardwareRayTracing=1
;   r.Lumen.HardwareRayTracing.LightingMode=2
;   r.Lumen.HardwareRayTracing.Inline=1
;   r.Lumen.Reflections.HardwareRayTracing=1
;   r.Lumen.TranslucencyVolume.HardwareRayTracing=1
;   r.Lumen.ScreenProbeGather.HardwareRayTracing=1
r.Lumen.HardwareRayTracing=0
r.Lumen.Reflections.HardwareRayTracing=0
r.Lumen.TranslucencyVolume.HardwareRayTracing=0
r.Lumen.ScreenProbeGather.HardwareRayTracing=0

; --- Nanite ------------------------------------------------------
; DISABLED 2026-05-29: AcademyMap crashes on a Foreground Worker
; thread with IntFitsIn<OutType>(In) assertion in Renderer.dll.
; Disabling HW RT didn't help. Worker-thread + per-primitive +
; "empty bounds" warning flood strongly suggests Nanite cluster
; generation choking on a degenerate procedural StaticMesh (planar
; quads from sign Books, etc) built via the Python MeshDescription
; pipeline.
; Originally: r.Nanite=1, r.Nanite.ProjectEnabled=True
; Restore once we've root-caused which mesh is degenerate, or once
; the procedural-build pipeline guarantees Nanite-safe meshes (>= 3
; non-coplanar triangles per mesh, valid tangent basis, etc).
r.Nanite=0
r.Nanite.ProjectEnabled=False
r.SkinCache.CompileShaders=True

; --- Anti-aliasing / upscaling -----------------------------------
r.AntiAliasingMethod=4   ; TSR (Temporal Super Resolution)
r.TemporalAA.Algorithm=1
r.AllowStaticLighting=False  ; fully dynamic; Lumen handles it

; --- Defaults the brief calls out as visual upgrades -------------
; AutoExposure DISABLED 2026-05-30. The academy materials are now Unlit
; / Emissive (AC bakes its lighting into vertex colors; we render the
; textures self-illuminated rather than via dynamic lights). With auto-
; exposure ON, UE's eye adaptation locks onto the bright emissive portal
; and crushes the stone surfaces to black — which is exactly the "whole
; academy renders black" symptom. A fixed exposure shows the unlit
; textures at their true brightness. Was: r.DefaultFeature.AutoExposure=True
r.DefaultFeature.AutoExposure=False
r.DefaultFeature.AutoExposure.ExtendDefaultLuminanceRange=True
r.DefaultFeature.MotionBlur=False
r.DefaultFeature.Bloom=True
r.DefaultFeature.LensFlare=True
r.DefaultFeature.AmbientOcclusion=True
r.DefaultFeature.AmbientOcclusionStaticFraction=False

; --- Virtual textures + virtual shadow maps ----------------------
r.VirtualTextures=True
r.VirtualTexturedLightmaps=True
r.Shadow.Virtual.Enable=1

; --- Shading model -----------------------------------------------
r.CustomDepth=3   ; enable with stencil

; --- Exposure ----------------------------------------------------
; Force a FIXED exposure (disable eye adaptation entirely). The academy
; renders Unlit/Emissive, so the only correct exposure is a fixed one;
; any adaptation latches onto the bright emissive portal and crushes the
; stone to black. r.DefaultFeature.AutoExposure=False (above) sets the
; default method, but a PostProcessVolume can still re-introduce manual/
; camera-based exposure — EyeAdaptationQuality=0 hard-disables the whole
; adaptation pass so the result is deterministic regardless of PPV state.
[SystemSettings]
r.EyeAdaptationQuality=0

