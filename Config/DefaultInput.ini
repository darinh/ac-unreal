; =====================================================================
; Legacy axis/action mappings consumed by AcAcademyCharacter via
; UInputComponent::BindAxis / BindAction in SetupPlayerInputComponent.
;
; UE5 EnhancedInputComponent inherits from UInputComponent, so these
; legacy calls still work — they emit a deprecation warning but
; function correctly. The migration to authored IA_*/IMC_* uassets is
; deferred to a follow-up Phase (Phase 6+) when input dispatch needs
; to switch contexts (chat / world / inventory).
;
; The C++ axis names (MoveForward, MoveRight, Turn, LookUp, Jump) must
; match the AxisName/ActionName strings here exactly.
; =====================================================================

[/Script/Engine.InputSettings]
+AxisMappings=(AxisName="MoveForward",Scale= 1.0,Key=W)
+AxisMappings=(AxisName="MoveForward",Scale=-1.0,Key=S)
+AxisMappings=(AxisName="MoveForward",Scale= 1.0,Key=Up)
+AxisMappings=(AxisName="MoveForward",Scale=-1.0,Key=Down)
+AxisMappings=(AxisName="MoveForward",Scale= 1.0,Key=Gamepad_LeftY)

+AxisMappings=(AxisName="MoveRight",Scale= 1.0,Key=D)
+AxisMappings=(AxisName="MoveRight",Scale=-1.0,Key=A)
+AxisMappings=(AxisName="MoveRight",Scale= 1.0,Key=Gamepad_LeftX)

; Mouse yaw (Turn) — per-frame mouse delta, NOT scaled by DeltaSeconds in the handler.
+AxisMappings=(AxisName="Turn",Scale= 1.0,Key=MouseX)

; Mouse pitch (LookUp) — Scale -1 because MouseY's +Y is downward.
+AxisMappings=(AxisName="LookUp",Scale=-1.0,Key=MouseY)

; Keyboard arrow / gamepad stick yaw — held rate, scaled by DeltaSeconds inside
; the handler so turn speed is frame-rate independent. Separate axis name
; (TurnRate vs Turn) so we can route them through different handlers.
+AxisMappings=(AxisName="TurnRate",Scale=-1.0,Key=Left)
+AxisMappings=(AxisName="TurnRate",Scale= 1.0,Key=Right)
+AxisMappings=(AxisName="TurnRate",Scale= 1.0,Key=Gamepad_RightX)

; Keyboard / gamepad pitch rate.
+AxisMappings=(AxisName="LookUpRate",Scale=-1.0,Key=Gamepad_RightY)

+ActionMappings=(ActionName="Jump",bShift=False,bCtrl=False,bAlt=False,bCmd=False,Key=SpaceBar)
+ActionMappings=(ActionName="Jump",bShift=False,bCtrl=False,bAlt=False,bCmd=False,Key=Gamepad_FaceButton_Bottom)

